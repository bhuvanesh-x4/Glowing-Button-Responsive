<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Socials — Minimal</title>

  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --border:rgba(17,24,39,.12);
      --text:#0f172a;
      --muted:rgba(15,23,42,.62);

      --accent:#2563eb;
      --accent2:#7c3aed;

      --radius:18px;
      --shadow: 0 18px 45px rgba(2, 6, 23, .08);
      --ring: 0 0 0 4px rgba(37,99,235,.12);
    }

    *{ box-sizing:border-box; }
    html, body{ margin:0; padding:0; }

    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 400px at 15% 0%, rgba(37,99,235,.10), transparent 55%),
        radial-gradient(800px 400px at 85% 10%, rgba(124,58,237,.10), transparent 55%),
        linear-gradient(180deg, var(--bg), #fff);
    }

    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .hero{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .hero h2{
      margin:0;
      font-size: 22px;
      letter-spacing: .2px;
    }

    .hero p{
      margin:8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 920px){
      .grid{ grid-template-columns: 1fr; }
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .panelHead{
      padding: 14px 16px;
      border-bottom: 1px solid rgba(15,23,42,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .panelHead b{
      font-size: 14px;
      letter-spacing: .2px;
    }
    .panelHead span{
      font-size: 12px;
      color: var(--muted);
    }

    /* STACKED CONTACT LIST (GMAIL + PHONE under it) */
    .list{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }

    .tile{
      border: 1px solid rgba(15,23,42,.12);
      border-radius: 16px;
      padding: 12px;
      display:flex;
      align-items:center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.92));
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      min-width: 0;
    }

    .tile:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(2,6,23,.10);
      border-color: rgba(37,99,235,.35);
    }

    .icon{
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(37,99,235,.10);
      border: 1px solid rgba(37,99,235,.18);
      flex: 0 0 auto;
      color: var(--text);
    }

    .info{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .info small{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .value{
      font-size: 13px;
      font-weight: 950;
      text-decoration:none;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* ensures no overlap */
      max-width: 100%;
      display:block;
    }

    .actions{
      display:flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .btn{
      cursor:pointer;
      border:none;
      border-radius: 12px;
      padding: 9px 10px;
      font-weight: 950;
      font-size: 12px;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      white-space: nowrap;
    }

    .btnPrimary{
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(37,99,235,.20);
    }
    .btnPrimary:hover{ transform: translateY(-1px); }
    .btnPrimary:active{ transform: translateY(0px) scale(.98); }

    .btnGhost{
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(15,23,42,.12);
    }
    .btnGhost:hover{ transform: translateY(-1px); border-color: rgba(37,99,235,.35); }
    .btnGhost:active{ transform: translateY(0px) scale(.98); }

    /* FORM */
    .form{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px){
      .row{ grid-template-columns: 1fr; }
    }

    label{
      font-size: 12px;
      color: var(--muted);
      font-weight: 900;
      display:block;
      margin: 0 0 6px;
    }

    input, textarea{
      width: 100%;
      border: 1px solid rgba(15,23,42,.14);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
      background: #fff;
    }
    input:focus, textarea:focus{
      border-color: rgba(37,99,235,.50);
      box-shadow: var(--ring);
    }
    textarea{ min-height: 118px; resize: vertical; }

    .submit{
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border:none;
      cursor:pointer;
      font-weight: 950;
      letter-spacing: .2px;
      color:#fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 30px rgba(37,99,235,.22);
      transition: transform 140ms ease, filter 140ms ease;
    }
    .submit:hover{ transform: translateY(-1px); filter: brightness(1.02); }
    .submit:active{ transform: translateY(0px) scale(.99); }

    /* TOAST */
    .toast{
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(2,6,23,0.92);
      color:#fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 950;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events:none;
    }
    .toast.show{ opacity:1; transform: translateY(0); }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="hero">
      <h2>Socials</h2>
      
    </div>

    <div class="grid">

      <!-- LEFT: Stacked Gmail then Phone -->
      <section class="panel">
        <div class="panelHead">
          <div>
            <b>Reach me</b><br>
            <span>Copy or open instantly</span>
          </div>
        </div>

        <div class="list">
          <!-- Gmail -->
          <div class="tile">
            <div class="icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M4 7.2V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                <path d="M4 8l8 6 8-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="info">
              <small>Gmail</small>
              <a class="value" href="mailto:bhuvaneshV4@gmail.com">VinayC174@gmail.com</a>
            </div>

            <div class="actions">
              <button class="btn btnGhost" type="button" data-copy="bhuvaneshV4@gmail.com">Copy</button>
              <a class="btn btnPrimary" href="mailto:VinayChalgeri17@gmail.com" style="text-decoration:none; display:inline-block;">Mail</a>
            </div>
          </div>

          <!-- Phone (below Gmail) -->
          <div class="tile">
            <div class="icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M6.6 4.8c.7-1 2.1-1.1 3-.2l2 2c.7.7.7 1.8.1 2.6l-.8 1.2c1.1 2 2.8 3.6 4.8 4.8l1.2-.8c.8-.6 1.9-.6 2.6.1l2 2c.9.9.8 2.3-.2 3-1 .8-2.2 1.2-3.5 1.1-6.8-.6-12.3-6.1-12.9-12.9-.1-1.3.3-2.5 1.1-3.5Z"
                      stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <div class="info">
              <small>Phone</small>
              <a class="value" href="tel:+919663394621">+91 96633 94621</a>
            </div>

            <div class="actions">
              <button class="btn btnGhost" type="button" data-copy="+919663394621">Copy</button>
              <a class="btn btnPrimary" href="tel:+919663394621" style="text-decoration:none; display:inline-block;">Call</a>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT: Queries -->
      <section class="panel">
        <div class="panelHead">
          <div>
            <b>Queries</b><br>
            <span>Send a message</span>
          </div>
        </div>

        <form class="form" id="queryForm">
          <div class="row">
            <div>
              <label for="qName">Name</label>
              <input id="qName" type="text" placeholder="Your name" required />
            </div>
            <div>
              <label for="qEmail">Email</label>
              <input id="qEmail" type="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div>
            <label for="qMsg">Message</label>
            <textarea id="qMsg" placeholder="Type your query..." required></textarea>
          </div>

          <button class="submit" type="submit">Submit</button>
        </form>
      </section>

    </div>
  </div>

  <div class="toast" id="toast">Copied ✅</div>

  <script>
    const toast = document.getElementById("toast");

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(()=>toast.classList.remove("show"), 900);
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
        showToast("Copied ✅");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showToast("Copied ✅");
      }
    }

    document.querySelectorAll("[data-copy]").forEach(btn=>{
      btn.addEventListener("click", ()=> copyText(btn.getAttribute("data-copy")));
    });

    // Form -> opens mail client (mailto) with prefilled details (best for Google Sites embed)
    document.getElementById("queryForm").addEventListener("submit", (e)=>{
      e.preventDefault();

      const name = document.getElementById("qName").value.trim();
      const email = document.getElementById("qEmail").value.trim();
      const msg = document.getElementById("qMsg").value.trim();

      const subject = encodeURIComponent(`Portfolio Query from ${name}`);
      const body = encodeURIComponent(
        `Name: ${name}\nEmail: ${email}\n\nMessage:\n${msg}\n`
      );

      window.location.href = `mailto:bhuvaneshV4@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
